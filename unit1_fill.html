<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 1 - Fill in the Blanks</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #0d1117;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #94a3b8;
            font-size: 15px;
        }

        .close-btn {
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .close-btn:hover {
            color: #fff;
        }

        .progress-indicator {
            color: #facc15;
            font-weight: bold;
        }

        .question-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            color: #f1f5f9;
        }

        .input-box-container {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .input-inline {
            background: #090d16;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            outline: none;
            width: 100%;
            max-width: 280px;
            text-align: center;
        }

        .input-inline:focus {
            border-color: #38bdf8;
        }

        .action-btn {
            width: 100%;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: rgba(51, 65, 85, 0.9);
        }

        .feedback {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
        }

        .feedback.wrong {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .correct-answer-text {
            color: #38bdf8;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
        }

        .nav-footer {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .nav-btn {
            flex: 1;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: rgba(51, 65, 85, 0.8);
            color: #fff;
        }

        .nav-btn.next-active {
            background: #22c55e;
            color: #fff;
            border: none;
        }

        .nav-btn.next-active:hover {
            background: #16a34a;
        }

        .exit-btn {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: 0.2s;
        }

        .exit-btn:hover {
            background: rgba(51, 65, 85, 0.8);
            color: #fff;
        }

        /* Result View */
        .result-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #38bdf8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            background: #090d16;
        }

        .score-circle .percent {
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
        }

        .score-circle .details {
            font-size: 11px;
            color: #94a3b8;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Bar matching Image 1 -->
    <div class="top-bar">
        <a href="unit1.html" class="close-btn">&lsaquo; Close</a>
        <div class="progress-indicator"><span id="currentQNum">1</span> / 73</div>
    </div>

    <!-- Quiz Card Area -->
    <div id="quizBox">
        <div class="question-card" id="questionContainer">
            <!-- Question text -->
        </div>

        <div class="input-box-container">
            <input type="text" id="userInput" class="input-inline" placeholder="အဖြေရိုက်ထည့်ပါ..." autocomplete="off">
        </div>

        <div class="action-btn" id="checkActionBtn" onclick="checkAnswer()">
            အဖြေစစ်မည်
        </div>

        <div class="feedback" id="feedbackBox"></div>

        <div class="nav-footer">
            <button class="nav-btn" onclick="prevQuestion()">အရင်အပုဒ်သို့</button>
            <button class="nav-btn next-active" onclick="nextQuestion()">နောက်တစ်ပုဒ်သို့ &rarr;</button>
        </div>

        <a href="unit1.html" class="exit-btn">ထွက်မည်</a>
    </div>

    <!-- Result Screen -->
    <div id="resultBox" class="result-card hidden">
        <h2 style="color: #60a5fa; margin-bottom: 10px;">🎉 သင်တန်း ပြီးဆုံးပါပြီ! 🎉</h2>
        <div class="score-circle">
            <span class="percent" id="finalPercentage">0%</span>
            <span class="details" id="finalScoreRatio">0 / 73</span>
        </div>
        <p id="resultSummary" style="font-size: 15px; margin-bottom: 8px; color: #cbd5e1;"></p>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">မှားယွင်းခဲ့သော မေးခွန်း အရေအတွက်: <span id="finalWrong" style="color:#f87171; font-weight:bold;">0</span> ပုဒ်</p>
        
        <a href="unit1.html" class="exit-btn" style="background: #22c55e; color: #fff; border: none; font-weight: bold;">🏠 Unit 1 သို့ ပြန်မည်</a>
    </div>
</div>

<script>
    const questionsData = [
        { id: 1, prefix: "(1) Not only officers but also the staff perform their assigned duties c", suffix: ".", answer: "scientifically" },
        { id: 2, prefix: "(2) In our country, taking off s", suffix: " before entering a temple is not only a traditional practice but also a sign of respect.", answer: "shoes" },
        { id: 3, prefix: "(3) Drinking water is v", suffix: " for staying hydrated.", answer: "vital" },
        { id: 4, prefix: "(4) She conducted herself in a polite and respectful m", suffix: " during the entire meeting.", answer: "manner" },
        { id: 5, prefix: "(5) It is not polite to i", suffix: " someone while they are speaking.", answer: "interrupt" },
        { id: 6, prefix: "(6) Ancient Olympia was the b", suffix: " of the Olympic Games because the games were held there thousands of years ago.", answer: "birthplace" },
        { id: 7, prefix: "(7) In some cultures, b", suffix: " after a meal is considered a compliment to the chef.", answer: "burping" },
        { id: 8, prefix: "(8) After his death, his assets will be transferred to his c", suffix: " foundation.", answer: "charitable" },
        { id: 9, prefix: "(9) Passing the e", suffix: " examination is a requirement for admission to the university.", answer: "entrance" },
        { id: 10, prefix: "(10) Love and relationships will always be a topic of u", suffix: " interest.", answer: "universal" },
        { id: 11, prefix: "(11) Good manners are essential in s", suffix: " dealings to maintain healthy relationships.", answer: "social" },
        { id: 12, prefix: "(12) His comments were c", suffix: " and rude, making everyone uncomfortable at the meeting.", answer: "crude" },
        { id: 13, prefix: "(13) C", suffix: " words are words, whose meanings are shaped by a particularly society and which do not have direct equivalent in other language.", answer: "Culture-bound" },
        { id: 14, prefix: "(14) It is our responsibility to protect the environment for future g", suffix: ".", answer: "generations" },
        { id: 15, prefix: "(15) The i", suffix: " diamonds looked almost identical to the original one, but they were slightly different in the fire, scintillation, and sparkle of the real gem.", answer: "imitation" },
        { id: 16, prefix: "(16) In this region, the custom of having a feast after harvesting has been practiced for a very long time and it has become an i", suffix: " one.", answer: "ingrained" },
        { id: 17, prefix: "(17) It is claimed that watching violence on TV makes some children more a", suffix: ".", answer: "aggressive" },
        { id: 18, prefix: "(18) The kidneys serve a v", suffix: " function in eliminating waste from the blood.", answer: "vital" },
        { id: 19, prefix: "(19) My brother is a", suffix: " new skills through online courses to advance his career.", answer: "acquiring" },
        { id: 20, prefix: "(20) Could you p", suffix: " it on to Aung Aung when you've finished reading it.", answer: "pass" },
        { id: 21, prefix: "(21) One of the t", suffix: " in Myanmar is to remove shoes when entering the house.", answer: "traditions" },
        { id: 22, prefix: "(22) As the older sibling, you are r", suffix: " for looking out for your younger brother.", answer: "responsible" },
        { id: 23, prefix: "(23) ABC Foundation is known for its c", suffix: " efforts because it enhances health and increases access to education and opportunities around the world.", answer: "charitable" },
        { id: 24, prefix: "(24) You should always r", suffix: " the opinions of other people.", answer: "respect" },
        { id: 25, prefix: "(25) After graduation, we are certain that the knowledge we have a", suffix: " will enable us to be successful in whatever field we may enter.", answer: "acquired" },
        { id: 26, prefix: "(26) She is r", suffix: " for organizing the meeting for next week.", answer: "responsible" },
        { id: 27, prefix: "(27) The teacher created a pleasant a", suffix: " in the classroom, which encouraged students to participate actively.", answer: "atmosphere" },
        { id: 28, prefix: "(28) Parents should i", suffix: " good manners to their children from an early age.", answer: "instill" },
        { id: 29, prefix: "(29) We have a family dinner for a next Sunday. Could you possibly d", suffix: " me a favour and kindly look after our kitchen while we are out?", answer: "do" },
        { id: 30, prefix: "(30) To have a successful garden, you need to c", suffix: " the soil before planting seeds.", answer: "cultivate" },
        { id: 31, prefix: "(31) Her positive a", suffix: " towards her business helped her become a senior executive.", answer: "attitude" },
        { id: 32, prefix: "(32) Giving up your seat on the bus to an elderly person is a sign of good m", suffix: ".", answer: "manners" },
        { id: 33, prefix: "(33) Regular exercise is v", suffix: " for your health and fitness.", answer: "vital" },
        { id: 34, prefix: "(34) The car c", suffix: " reach its destination in two hours if there is not too much traffic.", answer: "can" },
        { id: 35, prefix: "(35) All motorcyclists s", suffix: " wear helmets for their safety.", answer: "should" },
        { id: 36, prefix: "(36) You m", suffix: " be honest if you want to build trust in friendship.", answer: "must" },
        { id: 37, prefix: "(37) It c", suffix: " be expensive to keep a pet dog for companionship and love.", answer: "can" },
        { id: 38, prefix: "(38) They s", suffix: " have so many children if they are not able to support them.", answer: "shouldn't" },
        { id: 39, prefix: "(39) You're carrying too much, I", suffix: " open the door for you.", answer: "'ll" },
        { id: 40, prefix: "(40) He is studying late because he m", suffix: " finish his project by tomorrow.", answer: "must" },
        { id: 41, prefix: "(41) We s", suffix: " eat more vegetables for a balanced diet.", answer: "should" },
        { id: 42, prefix: "(42) The flight w", suffix: " arrived at the airport by 6 p.m. tomorrow.", answer: "will have" },
        { id: 43, prefix: "(43) According to the weather forecast, it m", suffix: " rain heavily tomorrow.", answer: "might" },
        { id: 44, prefix: "(44) If you want to get a master's degree, you m", suffix: " study regularly.", answer: "must" },
        { id: 45, prefix: "(45) You d", suffix: " go to the bank to do a transfer. You can simply do it online at any time that is convenient for you.", answer: "don't need to" },
        { id: 46, prefix: "(46) I s", suffix: " have said that. I wasn't careful what I said to him and I hurt his feeling.", answer: "shouldn't" },
        { id: 47, prefix: "(47) Some manners are u", suffix: "; for example, table manners are adopted in every country.", answer: "universal" },
        { id: 48, prefix: "(48) Saying 'thank you' is a socially a", suffix: " manner in our culture.", answer: "acceptable" },
        { id: 49, prefix: "(49) Parents and teachers play a v", suffix: " role in shaping their children's attitudes.", answer: "vital" },
        { id: 50, prefix: "(50) To i", suffix: " knowledge to students is one of the chief duties of a teacher.", answer: "impart" },
        { id: 51, prefix: "(51) R", suffix: " models may influence the lifestyles of teenagers: the way they dress and the way they behave.", answer: "Role" },
        { id: 52, prefix: "(52) For some students, their teachers are r", suffix: " models for them to imitate.", answer: "role" },
        { id: 53, prefix: "(53) Our company has b", suffix: " a reputation for quality and service.", answer: "built" },
        { id: 54, prefix: "(54) My cousins are fond of swimming. They have a nice s", suffix: " pool in their backyard.", answer: "swimming" },
        { id: 55, prefix: "(55) The Eiffel Tower in France is one of the w", suffix: " landmarks.", answer: "world-famous" },
        { id: 56, prefix: "(56) A university student who has not received a bachelor's degree yet is called an u", suffix: ".", answer: "undergraduate" },
        { id: 57, prefix: "(57) A teacher has a lot of influence on society, and so he or she is often regarded as the b", suffix: " of the society.", answer: "backbone" },
        { id: 58, prefix: "(58) Canada and New Zealand are E", suffix: " countries where English is used as the first language.", answer: "English-speaking" },
        { id: 59, prefix: "(59) As soon as she graduated from a university, she got a f", suffix: " job.", answer: "full-time" },
        { id: 60, prefix: "(60) If you want to leave the hotel after 2 p.m., you must ask for a late c", suffix: ".", answer: "check-out" },
        { id: 61, prefix: "(61) Cassette recorders are no longer used by most people because they are too o", suffix: ".", answer: "out-of-date" },
        { id: 62, prefix: "(62) Although he is not w", suffix: ", he is kind-hearted and popular among his friends.", answer: "well-off" },
        { id: 63, prefix: "(63) Many people in big cities prefer f", suffix: " foods to homemade foods.", answer: "fast" },
        { id: 64, prefix: "(64) All applicants m", suffix: " take an entrance examination.", answer: "must" },
        { id: 65, prefix: "(65) C", suffix: " you ride a motorcycle?", answer: "Can" },
        { id: 66, prefix: "(66) You look pale and sick. You s", suffix: " go and see a doctor.", answer: "should" },
        { id: 67, prefix: "(67) The elders of this generation s", suffix: " teach their children to be polite.", answer: "should" },
        { id: 68, prefix: "(68) You m", suffix: " not smoke in public areas.", answer: "must" },
        { id: 69, prefix: "(69) The police have done as much as they c", suffix: " to find the missing boy.", answer: "could" },
        { id: 70, prefix: "(70) Students m", suffix: " not leave the examination hall without permission.", answer: "must" },
        { id: 71, prefix: "(71) Although she is young, she c", suffix: " speak three languages.", answer: "can" },
        { id: 72, prefix: "(72) All passengers m", suffix: " wear seat belts when they are in a car or plane.", answer: "must" },
        { id: 73, prefix: "(73) If you are disturbed by this ringtone, you c", suffix: " change it.", answer: "can" }
    ];

    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let isChecked = false;

    function loadProgress() {
        const savedIndex = localStorage.getItem("unit1_currentIndex");
        const savedCorrect = localStorage.getItem("unit1_correctCount");
        const savedWrong = localStorage.getItem("unit1_wrongCount");

        if (savedIndex !== null) {
            currentIndex = parseInt(savedIndex, 10);
            correctCount = parseInt(savedCorrect, 10) || 0;
            wrongCount = parseInt(savedWrong, 10) || 0;
        }

        if (currentIndex >= questionsData.length) {
            showResults();
        } else {
            renderQuestion();
        }
    }

    function saveProgress() {
        localStorage.setItem("unit1_currentIndex", currentIndex);
        localStorage.setItem("unit1_correctCount", correctCount);
        localStorage.setItem("unit1_wrongCount", wrongCount);
    }

    function renderQuestion() {
        isChecked = false;
        const q = questionsData[currentIndex];
        
        document.getElementById("currentQNum").innerText = currentIndex + 1;

        const container = document.getElementById("questionContainer");
        container.innerHTML = `${q.prefix}_____ ${q.suffix}`;

        const input = document.getElementById("userInput");
        input.value = "";
        input.disabled = false;

        const feedbackBox = document.getElementById("feedbackBox");
        feedbackBox.className = "feedback";
        feedbackBox.style.display = "none";
        feedbackBox.innerHTML = "";

        const checkBtn = document.getElementById("checkActionBtn");
        checkBtn.style.display = "block";
        checkBtn.innerText = "အဖြေစစ်မည်";

        input.focus();

        input.onkeypress = function(e) {
            if (e.key === "Enter") {
                if (!isChecked) {
                    checkAnswer();
                } else {
                    nextQuestion();
                }
            }
        };
    }

    function checkAnswer() {
        const input = document.getElementById("userInput");
        const userAns = input.value.trim().toLowerCase();
        const currentQ = questionsData[currentIndex];
        const correctAns = currentQ.answer.toLowerCase();

        if (userAns === "") return;

        isChecked = true;
        const feedbackBox = document.getElementById("feedbackBox");

        if (userAns === correctAns) {
            correctCount++;
            feedbackBox.className = "feedback correct";
            feedbackBox.innerHTML = "✓ မှန်ကန်ပါသည်။ တော်ပါပေတယ်။";
        } else {
            wrongCount++;
            feedbackBox.className = "feedback wrong";
            feedbackBox.innerHTML = `✗ မှားယွင်းပါသည်!<br>အဖြေမှန်: <span class="correct-answer-text">${currentQ.prefix}${currentQ.answer}${currentQ.suffix}</span>`;
        }

        feedbackBox.style.display = "block";
        input.disabled = true;
        document.getElementById("checkActionBtn").style.display = "none";

        saveProgress();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            saveProgress();
            renderQuestion();
        }
    }

    function nextQuestion() {
        currentIndex++;
        saveProgress();

        if (currentIndex >= questionsData.length) {
            showResults();
        } else {
            renderQuestion();
        }
    }

    function showResults() {
        document.getElementById("quizBox").classList.add("hidden");
        document.querySelector(".top-bar").classList.add("hidden");
        
        const resultBox = document.getElementById("resultBox");
        resultBox.classList.remove("hidden");

        const total = questionsData.length;
        const percentage = Math.round((correctCount / total) * 100);

        document.getElementById("finalPercentage").innerText = `${percentage}%`;
        document.getElementById("finalScoreRatio").innerText = `${correctCount} / ${total}`;
        document.getElementById("finalWrong").innerText = wrongCount;

        let summaryText = "";
        if (percentage >= 80) {
            summaryText = "ဂုဏ်ယူပါတယ်။ အထူးကောင်းမွန်သော ရလဒ်ဖြစ်ပါတယ်။ 🌟";
        } else if (percentage >= 50) {
            summaryText = "ကောင်းမွန်သော ရလဒ်ဖြစ်ပါတယ်။ နောက်ထပ် လေ့ကျင့်ပါဦး။ 👍";
        } else {
            summaryText = "ကြိုးစားပါဦး။ အစကနေ ပြန်လည် လေ့ကျင့်ကြည့်ပါ။ 💪";
        }
        document.getElementById("resultSummary").innerText = summaryText;
    }

    loadProgress();
</script>

</body>
</html>
